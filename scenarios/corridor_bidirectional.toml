# Two streams walking through each other in a straight corridor.
# The lane-formation test from docs/PLAN.md, at M0 scale.
#
# Real bug, found and fixed: the two [[targets]] below sit one at each end, so that each stream
# has a target on the OPPOSITE side to walk across to. But every brain assigns a fresh fly to
# whichever target is nearest by straight-line distance (see brains/targeting.py), and a fly
# spawned right at x=1 always finds the x=1 target (0 m away) closer than the x=39 one (38 m
# away) -- so without the explicit `target =` pin below, nobody ever actually crosses the
# corridor; both streams just sit at their own end, never having gone anywhere. `target = <index>`
# on each source (0-indexed into [[targets]], in file order) pins that source's flies to the FAR
# target explicitly, sidestepping nearest-distance assignment for exactly the case it can't
# handle. See `SpawnConfig.source_targets` in flybrainflow/scenario.py for the full explanation.

[scenario]
name            = "corridor_bidirectional"
seed            = 42
duration_s      = 300
scale_mode      = "pedestrian"      # "pedestrian" | "car"
boundary_mode   = "open"            # "open" | "closed"
timescale_ratio = 1.0               # brain ms per world ms

[map]
# open_ends=1: this scenario sets [wind].speed_mps > 0 below, and a corridor generated without
# open_ends is a sealed box for airflow purposes -- real gap, found by the new AirflowField
# warning added this session (see flybrainflow/world/airflow.py): this scenario's own wind dial
# was silently doing nothing, because the map had no declared opening for air to actually enter
# or leave through. open_ends only affects airflow, not pedestrian walkability (see
# world.map._open_ends_x's own docstring) -- flies still can't walk past either end.
source          = "gen:corridor?length=40&width=5&open_ends=1"   # or "venues/x.svg", "roads.geojson", "osm:N,S,E,W"
walkable_grid_m = 0.1

[wind]
direction_deg = 0
speed_mps     = 0.5

[spawn]
# target = 0 -> the [[targets]] entry at x=39; target = 1 -> the one at x=1 (file order below).
sources        = [{ position = [1.0, 2.5], target = 0 }, { position = [39.0, 2.5], target = 1 }]
rate_per_s     = 1.5
population_cap = 200

[[targets]]
kind           = "sugar"
position       = [39.0, 2.5]
slots          = 6
feeding_time_s = 2.0
odor_strength  = 1.0
odor_range_m   = 30

[[targets]]
kind           = "sugar"
position       = [1.0, 2.5]
slots          = 6
feeding_time_s = 2.0
odor_strength  = 1.0
odor_range_m   = 30

[agents]
personality_mix   = "uniform20"
sensing_radius_m  = 3.0
field_of_view_deg = 270
radius_m          = 0.25
max_speed_mps     = 1.3

[baseline]
enabled = true
